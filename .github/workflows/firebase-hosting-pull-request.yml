# This workflow compiles and verifies pull request builds securely without exposing secrets
name: Verify Pull Request Build
on: pull_request

permissions:
  contents: read

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build
        run: npm run build
