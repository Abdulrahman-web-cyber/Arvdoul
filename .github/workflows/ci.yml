# .github/workflows/ci.yml - ARVDOUL CI/CD PIPELINE
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  # ========== LINT ==========
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  # ========== BUILD ==========
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  # ========== TEST ==========
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Run unit tests
        run: npm run test -- --coverage --watchAll=false
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  # ========== DEPLOY STAGING ==========
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting (Staging)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          channelId: preview
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ========== DEPLOY PRODUCTION ==========
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_PROD }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_PROD }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_PROD }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_PROD }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_PROD }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_PROD }}

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ========== DEPLOY FUNCTIONS ==========
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          working-directory: functions

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase Functions
        uses: firebase/firebase-action@master
        with:
          args: deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ========== ARCHITECTURE + COST GUARDS (HARD FAIL) ==========
  # These are enforcement gates, not advisories: unlike the advisory lint/test
  # jobs above, they MUST fail the pipeline. They freeze architectural
  # invariants so a future change cannot silently reintroduce a direct Firebase
  # import in UI, an upward (UI) import in a service, an unbounded Firestore
  # read, or a new realtime listener. (Directives §83/§84.)
  guards:
    name: Architecture & Cost Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      # `no-undef` is the crash-bug gate: it catches identifiers used but never
      # defined (e.g. comments.js referenced `db`/`FieldValue`, monetization.js
      # referenced `boostedExpiresAt`), which `node --check` and the deploy
      # test both miss. `--quiet` fails on errors while allowing the existing
      # warning backlog.
      - name: Lint the crash-bug gate (errors only)
        run: npx --no-install eslint src/ functions/ --ext .js,.jsx --quiet

      # The Firestore emulator is a JVM process. firebase-tools requires
      # Java 21+; the JVM refuses to boot on older runtimes.
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run architecture + cost guards
        run: >-
          npm run test -- --watchAll=false
          src/__tests__/architectureBoundaries.test.js
          src/__tests__/firebaseCostGuard.test.js
          src/__tests__/securityServices.test.js
          src/__tests__/callableAuthGate.test.js
          src/__tests__/deployIntegrity.test.js
          src/__tests__/sharedConfigSync.test.js
          src/__tests__/firestoreRulesCompile.test.js
          src/__tests__/firestoreRulesCoverage.test.js
          src/__tests__/notificationCounterRuleShape.test.js
          src/__tests__/rulesWriterFieldGuard.test.js
          src/__tests__/levelConfig.test.js
          src/__tests__/profileReadModel.test.js
          src/__tests__/userServicePrivacyProjection.test.js
          src/__tests__/profileSystemHardening.test.js
          src/__tests__/serviceReachability.test.js
          src/__tests__/serviceContract.test.js
          src/__tests__/socialGraphService.test.js
          src/__tests__/offlineQueueSingleOwner.test.js
          src/__tests__/offlineDrainIntegrity.test.js
          src/__tests__/profileFeedGridLikeCount.test.jsx
          src/__tests__/xpWiring.test.js
          src/__tests__/withdrawalGate.test.js
          src/__tests__/settingsWiring.test.js
          src/__tests__/dmPermissionWiring.test.js
          src/__tests__/integrationWiring.test.js
          src/__tests__/analyticsInteractionSink.test.js
          src/__tests__/videoEditorWiring.test.js
          src/__tests__/videoEditorRender.test.jsx
          src/__tests__/authContextContract.test.js
          src/__tests__/storeContract.test.js
          src/__tests__/contextContract.test.js
          src/__tests__/hookContract.test.js
          src/__tests__/deadEventGuard.test.js
          src/__tests__/deadWiringGuard.test.js
          src/__tests__/deadPropsGuard.test.js
          src/__tests__/routeParamWiringGuard.test.js
          src/__tests__/uiStateWiringGuard.test.js
          src/__tests__/reducerDispatchGuard.test.js
          src/__tests__/routeStateHandoffGuard.test.js
          src/__tests__/failOpenReadGuard.test.js
          src/__tests__/silentWriteFailureGuard.test.js
          src/__tests__/falseSuccessToastGuard.test.js
          src/__tests__/spacesRosterWiringGuard.test.js
          src/__tests__/localContentCacheGuard.test.js
          src/__tests__/liveWiringGuard.test.js
          src/__tests__/notificationsWiringGuard.test.js
          src/__tests__/highlightsWiringGuard.test.js
          src/__tests__/subscriptionLifecycleGuard.test.js
          src/__tests__/orphanModuleGuard.test.js
          src/__tests__/noFabricatedData.test.js
          src/__tests__/classNameInterpolationGuard.test.js
          src/__tests__/storageRulesDeploy.test.js
          src/__tests__/storageRulesPathAlignment.test.js
          src/__tests__/postVisibilityEnforcement.test.js
          src/__tests__/liveMonetizationGuard.test.js
          src/__tests__/serverOnlyCollectionWriteGuard.test.js
          src/__tests__/messagingSupportGuard.test.js
          src/__tests__/functionsContract.test.js
          src/__tests__/featureFlagConsumption.test.js
          src/__tests__/userServiceContract.test.js
          src/__tests__/designTokenDriftGuard.test.js
          src/__tests__/tailwindUtilities.test.js
          src/__tests__/reelsAndMessagesWiring.test.js
          src/__tests__/callFlowWiring.test.js
          src/__tests__/firestorePersistence.test.js
          src/__tests__/snapshotErrorHandling.test.js
          src/__tests__/routeIntegrityGuard.test.js
          src/__tests__/errorStateRenderedGuard.test.js
          src/__tests__/silentReadFailureGuard.test.js
          src/__tests__/sideEffectFailureGuard.test.js
          src/__tests__/functionsSilentCatchGuard.test.js
          src/__tests__/srcSilentCatchGuard.test.js
          src/__tests__/firestoreQueryIndexMap.test.js
          src/__tests__/a11yInteractiveGuard.test.js

      # The rules/graph adversarial checks only run against a live emulator.
      # `emulators:exec` boots it and exports FIRESTORE_EMULATOR_HOST for the
      # child, so `firestoreRulesCompile`/`socialGraphEdgeReadRules` execute
      # their live assertions instead of skipping.
      - name: Run Firestore rules + social-graph adversarial checks (emulator)
        run: >-
          npx firebase-tools emulators:exec
          --only firestore
          --project demo-arvdoul
          "npm run test -- --watchAll=false src/__tests__/firestoreRulesCompile.test.js src/__tests__/socialGraphEdgeReadRules.test.js src/__tests__/spacesRosterWiringGuard.test.js"

      # Storage rules are a separate emulator. This boots it and runs the live
      # half of the storage path-alignment guard: every canonical client upload
      # path is ALLOWED for its owner and DENIED for a different user, and
      # owner deletes succeed (N170).
      - name: Run Storage rules path-alignment checks (emulator)
        run: >-
          npx firebase-tools emulators:exec
          --only storage
          --project demo-arvdoul
          "npm run test -- --watchAll=false src/__tests__/storageRulesPathAlignment.test.js"

  # ========== SECURITY CHECK ==========
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        run: |
          npm install -g trufflehog || true
          # truffleHog --json . > secrets.json || true
        continue-on-error: true
