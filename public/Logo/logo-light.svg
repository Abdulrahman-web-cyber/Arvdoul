<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="arv-light-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="plate-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B82F6" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle Plate -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="22" ry="22" fill="url(#plate-light)" stroke="rgba(0,0,0,0.06)" stroke-width="1" />
  
  <!-- Specular highlight across top edge -->
  <path d="M 24 2.5 L 76 2.5" stroke="rgba(255,255,255,0.9)" stroke-width="1" stroke-linecap="round" />

  <!-- Master @-A Continuous Stroke -->
  <g filter="url(#shadow-light)">
    <!-- Outer loop wrapping counter-clockwise into the right leg of A -->
    <path d="M 64 86.5 C 44 94 13 81.5 12 50 C 11 22.5 31.5 12 50 12 C 72 12 88 28 88 50 C 88 62.5 81 73 72 78 L 52.5 25.5 C 51.5 23 48.5 23 47.5 25.5 L 30 69"
          fill="none"
          stroke="url(#arv-light-grad)"
          stroke-width="7.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
    
    <!-- Curved Crossbar of Capital A -->
    <path d="M 38 53.5 C 44 51.2 56 51.2 62 53.5"
          fill="none"
          stroke="url(#arv-light-grad)"
          stroke-width="6.5"
          stroke-linecap="round" />
  </g>
</svg>
