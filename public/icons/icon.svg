<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="arv-neon-cyan" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="vignette-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#052857" />
      <stop offset="70%" stop-color="#031433" />
      <stop offset="100%" stop-color="#010714" />
    </radialGradient>
    <filter id="glow-cyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#vignette-bg)" />

  <!-- Master @-A Continuous Stroke -->
  <g filter="url(#glow-cyan)">
    <!-- Outer loop wrapping counter-clockwise into the right leg of A -->
    <path d="M 64 86.5 C 44 94 13 81.5 12 50 C 11 22.5 31.5 12 50 12 C 72 12 88 28 88 50 C 88 62.5 81 73 72 78 L 52.5 25.5 C 51.5 23 48.5 23 47.5 25.5 L 30 69"
          fill="none"
          stroke="url(#arv-neon-cyan)"
          stroke-width="7.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
    
    <!-- Curved Crossbar of Capital A -->
    <path d="M 38 53.5 C 44 51.2 56 51.2 62 53.5"
          fill="none"
          stroke="url(#arv-neon-cyan)"
          stroke-width="6.5"
          stroke-linecap="round" />
  </g>
</svg>
