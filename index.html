<!-- index.html - ULTIMATE FIXED VERSION - NO DUPLICATE SPLASH -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="/icons/icon.png" />
    <link rel="apple-touch-icon" href="/icons/icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Security hardening: restrict to first-party + known third parties.
         NOTE: 'unsafe-inline' is required because index.html bootstraps with an
         inline error handler / SW registration and the app injects inline styles.
         A future hardening pass should move these to nonced external scripts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebasestorage.app https://*.firebaseio.com https://api.stripe.com https://*.algolia.net https://*.algolianet.com https://api.mymemory.translated.net https://www.google.com https://*.google.com; frame-src 'self' https://js.stripe.com https://www.google.com https://recaptcha.google.com https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(self)" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arvdoul">
    
    <!-- Performance & Responsiveness -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    
    <!--
      CRITICAL POLYFILL: window.matchMedia (runs before the app bundle).
      Framer Motion's useReducedMotion, ThemeProvider and useMediaQuery all
      call window.matchMedia unconditionally. Some embedded webviews / preview
      iframes do not implement it - which previously crashed the Intro screen
      into its error boundary ("Temporary Glitch") on every launch. Defining a
      no-op here guarantees the API always exists.
    -->
    <script>
      if (typeof window !== 'undefined' && typeof window.matchMedia !== 'function') {
        window.matchMedia = function (query) {
          return {
            matches: false,
            media: query || '',
            onchange: null,
            addListener: function () {},
            removeListener: function () {},
            addEventListener: function () {},
            removeEventListener: function () {},
            dispatchEvent: function () { return false; },
          };
        };
      }
    </script>
    
    <title>Arvdoul</title>
    <meta name="description" content="A feature-rich social network and creator suite featuring AI co-pilot studio, live audio spaces, viral sound discovery, creator marketplace, prediction markets, multi-track video editor, reels, and real-time feeds." />
    <meta property="og:title" content="Arvdoul" />
    <meta property="og:description" content="A feature-rich social network and creator suite featuring AI co-pilot studio, live audio spaces, viral sound discovery, creator marketplace, prediction markets, multi-track video editor, reels, and real-time feeds." />
    
    <!-- Critical CSS - Shows your app background immediately -->
    <style>
      /* CRITICAL: Prevent white/black flash */
      body {
        margin: 0;
        padding: 0;
        background: #000000; /* Match your splash screen background */
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      
      #root {
        position: relative;
        height: 100vh;
        width: 100vw;
      }
      
      /* Remove any splash screen if exists */
      #splash {
        display: none !important;
      }
      
      /* Prevent tap highlights (a11y: selection is allowed app-wide) */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Loading state for root */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
    </style>
    
    <!-- Global error handler -->
    <script>
      // Global error handler for better debugging
      window.addEventListener('error', function(event) {
        console.error('Global error:', {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          error: event.error
        });
        
        // Send to analytics if available
        if (window.gtag) {
          window.gtag('event', 'exception', {
            description: event.message,
            fatal: true
          });
        }
      });

      // Unhandled promise rejection
      window.addEventListener('unhandledrejection', function(event) {
        console.error('Unhandled promise rejection:', event.reason);
      });

      // Prevent double tap zoom on mobile
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
      
      // Prevent context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
    </script>
  </head>
  <body>
    <!-- Root container for React -->
    <div id="root">
      <!-- Temporary loading state - will be replaced by React immediately -->
      <div class="app-loading">
        <!-- This will be visible for ~100ms until React renders -->
        <div style="
          width: 60px;
          height: 60px;
          border: 3px solid rgba(255,255,255,0.1);
          border-top-color: #8b5cf6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>
      </div>
    </div>
    
    <!-- Main React Entry -->
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Add spin animation for loading spinner
      const style = document.createElement('style');
      style.textContent = `
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      `;
      document.head.appendChild(style);
    </script>
  </body>
</html>
