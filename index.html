<!-- index.html - ULTIMATE FIXED VERSION - NO DUPLICATE SPLASH -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="/icons/icon.png" />
    <link rel="apple-touch-icon" href="/icons/icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Security hardening: first-party + external APIs with websocket and preview support -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: http: ws: wss: data: blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(self)" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arvdoul">
    
    <!-- Performance & Responsiveness -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="mobile-web-app-capable" content="yes">
    
    <!--
      CRITICAL POLYFILL: window.matchMedia (runs before the app bundle).
      Framer Motion's useReducedMotion, ThemeProvider and useMediaQuery all
      call window.matchMedia unconditionally. Some embedded webviews / preview
      iframes do not implement it - which previously crashed the Intro screen
      into its error boundary ("Temporary Glitch") on every launch. Defining a
      no-op here guarantees the API always exists.
    -->
    <script>
      if (typeof window !== 'undefined' && typeof window.matchMedia !== 'function') {
        window.matchMedia = function (query) {
          return {
            matches: false,
            media: query || '',
            onchange: null,
            addListener: function () {},
            removeListener: function () {},
            addEventListener: function () {},
            removeEventListener: function () {},
            dispatchEvent: function () { return false; },
          };
        };
      }
    </script>
    
    <title>Arvdoul</title>
    <meta name="description" content="A feature-rich social network and creator suite featuring AI co-pilot studio, live audio spaces, viral sound discovery, creator marketplace, prediction markets, multi-track video editor, reels, and real-time feeds." />
    <meta property="og:title" content="Arvdoul" />
    <meta property="og:description" content="A feature-rich social network and creator suite featuring AI co-pilot studio, live audio spaces, viral sound discovery, creator marketplace, prediction markets, multi-track video editor, reels, and real-time feeds." />
    
    <!-- Critical CSS -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #03071B;
        min-height: 100%;
        width: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      #root {
        position: relative;
        min-height: 100vh;
        width: 100%;
      }
      
      /* Prevent tap highlights */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Instant initial splash styles */
      .initial-splash {
        position: fixed;
        inset: 0;
        background: #03071B;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        user-select: none;
      }

      .splash-logo-circle {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(59, 130, 246, 0.15));
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 92, 246, 0.25);
        margin-bottom: 24px;
        animation: pulseLogo 2s ease-in-out infinite;
      }

      .splash-logo-circle img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
      }

      .splash-title {
        font-size: 32px;
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: -0.025em;
        margin: 0 0 24px 0;
      }

      .splash-bar-container {
        width: 192px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        position: relative;
      }

      .splash-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        background: linear-gradient(90deg, #8B1EF3, #3B82F6, #EC4899);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(139, 30, 243, 0.5);
        animation: splashShimmer 1.4s ease-in-out infinite;
      }

      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      @keyframes splashShimmer {
        0% { left: -45%; width: 45%; }
        50% { width: 60%; }
        100% { left: 100%; width: 45%; }
      }
    </style>
    
    <!-- Global error logging -->
    <script>
      window.addEventListener('error', function(event) {
        console.warn('Arvdoul runtime note:', event.message);
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('Arvdoul promise note:', event.reason);
      });
    </script>
  </head>
  <body>
    <!-- Root container with immediate visual splash screen -->
    <div id="root">
      <div class="initial-splash" id="initial-splash">
        <div class="splash-logo-circle">
          <img src="/icons/icon.png" alt="Arvdoul" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
          <span style="display:none; font-size:36px; font-weight:bold; color:white;">A</span>
        </div>
        <h1 class="splash-title">Arvdoul</h1>
        <div class="splash-bar-container">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    
    <!-- Main React Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
