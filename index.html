<!-- index.html - ULTIMATE FIXED VERSION - NO DUPLICATE SPLASH -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="/icons/icon.png" />
    <link rel="apple-touch-icon" href="/icons/icon.png" />
    
    <!-- Theme Color: matches the token canvas (#03071B dark). ThemeProvider
         syncs this at runtime so light mode updates the browser chrome too. -->
    <meta name="theme-color" content="#03071B" />

    <!-- Self-hosted fonts: preload the two faces the shell paints with so the
         first text render does not wait on the CSS fetch. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect Firebase Auth / Google OAuth origins for fast Google sign-in -->
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <!-- Security hardening: first-party + explicit Firebase/Google Auth script origins
         for OAuth popup/iframe & reCAPTCHA with a strict allowlist. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' blob: https://apis.google.com https://www.gstatic.com https://accounts.google.com https://www.google.com https://recaptcha.net https://arvdoul-8057b.firebaseapp.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: http: ws: wss: data: blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), microphone=(self)" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arvdoul">
    
    <!-- Performance & Responsiveness -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="mobile-web-app-capable" content="yes">
    
    <!--
      CRITICAL POLYFILL: window.matchMedia (runs before the app bundle).
      Framer Motion's useReducedMotion, ThemeProvider and useMediaQuery all
      call window.matchMedia unconditionally. Some embedded webviews / preview
      iframes do not implement it - which previously crashed the Intro screen
      into its error boundary ("Temporary Glitch") on every launch. Defining a
      no-op here guarantees the API always exists.
    -->
    <script>
      if (typeof window !== 'undefined' && typeof window.matchMedia !== 'function') {
        window.matchMedia = function (query) {
          return {
            matches: false,
            media: query || '',
            onchange: null,
            addListener: function () {},
            removeListener: function () {},
            addEventListener: function () {},
            removeEventListener: function () {},
            dispatchEvent: function () { return false; },
          };
        };
      }
    </script>
    
    <title>Arvdoul</title>
    <meta name="description" content="A feature-rich social network and creator suite featuring AI co-pilot studio, live audio spaces, viral sound discovery, creator marketplace, prediction markets, multi-track video editor, reels, and real-time feeds." />
    <meta property="og:title" content="Arvdoul" />
    <meta property="og:description" content="A feature-rich social network and creator suite featuring AI co-pilot studio, live audio spaces, viral sound discovery, creator marketplace, prediction markets, multi-track video editor, reels, and real-time feeds." />
    
    <script>
      (function () {
        try {
          var saved = null;
          try { saved = window.localStorage && window.localStorage.getItem('theme'); } catch (_) {}
          var prefersDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(isDark ? 'dark' : 'light');
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          var bg = isDark ? '#03071B' : '#F6F8FC';
          root.style.backgroundColor = bg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg);
        } catch (_) {}
      })();
    </script>

    <!-- Critical CSS -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #F6F8FC;
        min-height: 100%;
        width: 100%;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background: #03071B;
      }

      #root {
        position: relative;
        min-height: 100vh;
        width: 100%;
      }

      /* Prevent tap highlights */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    
    <!-- Global error logging -->
    <script>
      window.addEventListener('error', function(event) {
        console.warn('Arvdoul runtime note:', event.message);
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('Arvdoul promise note:', event.reason);
      });
    </script>
  </head>
  <body>
    <!-- Root container -->
    <div id="root"></div>
    
    <!-- Main React Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
